name: Android Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "可选：构建完成后用于 Release 的标签名（留空则仅上传 Artifact）"
        required: false
      bundle_ja_model:
        description: "把日文模型打进 APK（+339 MB，首启即用，产物名带 -ja 后缀）"
        type: boolean
        default: false
      verify_ja_patch:
        description: "下载真实日文 decoder，校验语言标签补丁（多花几分钟）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 不用 android-actions/setup-android：新版镜像已移除旧 "tools" 包，该 action 会因此报错。
      # 直接复用 Runner 预装的 SDK，缺什么补什么。
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

          SM="$(find "$SDK/cmdline-tools" -maxdepth 2 -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          echo "sdkmanager: $SM (rev $(grep Pkg.Revision "$(dirname "$(dirname "$SM")")/source.properties" | cut -d= -f2))"

          yes | "$SM" --licenses > /dev/null 2>&1 || true
          [ -d "$SDK/platforms/android-34" ] || "$SM" "platforms;android-34"
          [ -d "$SDK/build-tools/34.0.0" ] || "$SM" "build-tools;34.0.0"

          echo "--- 已安装 ---"
          ls "$SDK/platforms" "$SDK/build-tools"

      # GitHub release 在国内经常下不动，这里直接从 hf-mirror 取（33 MB）。
      # sha256 与 ModelCatalog.japanese.mirrorFiles 里的一致。
      - name: Download Japanese decoder
        if: inputs.verify_ja_patch
        env:
          DECODER_URL: https://hf-mirror.com/csukuangfj/sherpa-onnx-streaming-zipformer-ar_en_id_ja_ru_th_vi_zh-2025-02-10/resolve/main/decoder-epoch-75-avg-11-chunk-16-left-128.onnx
          DECODER_SHA: 7ebc63f34b21c8efb4a41a5a2eee7fe1448829ce0230ecc5369e67fc14d90d48
        run: |
          OUT="$RUNNER_TEMP/ja-decoder.onnx"
          curl -fL --retry 3 --retry-delay 2 -o "$OUT" "$DECODER_URL"
          echo "$DECODER_SHA  $OUT" | sha256sum -c -
          echo "JA_DECODER=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: Unit tests
        run: |
          if [ -n "${JA_DECODER:-}" ]; then
            echo "校验真实 decoder：$JA_DECODER"
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace -PjaDecoder="$JA_DECODER"
          else
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          fi

      # 勾选 bundle_ja_model 时，构建前把日文模型放进 assets（脚本同时打语言标签补丁）。
      - name: Bundle Japanese model
        if: inputs.bundle_ja_model
        run: bash scripts/fetch-ja-model.sh

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        env:
          BUNDLE_JA: ${{ inputs.bundle_ja_model }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-manual}"
          SUFFIX=""
          if [ "${BUNDLE_JA:-false}" = "true" ]; then
            SUFFIX="-ja"
          fi
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK" "dist/AudioScript-${VERSION}${SUFFIX}.apk"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audioscript-apk-${{ github.ref_name }}${{ inputs.bundle_ja_model && '-ja' || '' }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            AudioScript Android 自动构建（Release 构建沿用 debug 签名，可直接侧载安装）。

            - 识别：sherpa-onnx 1.13 内置中英双语流式 Zipformer（本地）
            - 翻译：ML Kit 本地翻译（首次下载模型后离线）
            - 安装后需授权：录音、悬浮窗；系统声音另需一次「共享屏幕」授权
